name:                FortSymb
version:             0.1.0.0
github:              "johnzhenjx/FortSymb"
license:             BSD-3-Clause
author:              "John Zhen"
maintainer:          "johnzhenjx@outlook.com"
copyright:           "2026 John Zhen"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/johnzhenjx/FortSymb#readme>

dependencies:
- base >= 4.7 && < 5
- fortran-src
- containers
- bytestring
- what4
- parameterized-utils

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
  - GADTs

library:
  source-dirs: src

executables:
  FortSymb-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - FortSymb

tests:
  FortSymb-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - FortSymb
